<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Trabajo Fin De Año</h1>

    <div class="controls">
        <label for="exerciseSelector"><strong>Seleccionar Ejercicio:</strong></label>

        <select id="exerciseSelector">
            <option value="1">1. Mostrar 1 al 10 (for)</option>
            <option value="2">2. Sumar números del 1 al 100 (while)</option>
            <option value="3">3. Mostrar números pares (for)</option>
            <option value="4">4. Tabla de multiplicar con do-while</option>
            <option value="5">5. Calcular factorial con for</option>
            <option value="6">6. Contador regresivo con while</option>
        </select>

        <button onclick="ejecutarEjercicioSeleccionado()">Ejecutar</button>
    </div>

    <h3>Inputs Generales (Ejercicios 6-30)</h3>

    <div class="input-group">
        Input 1 (Principal): 
        <input type="text" id="input1" placeholder="Ej: 5,2,8,1 (Vector) o 1,2|3,4 (Matriz A)">
    </div>

    <div class="input-group">
        Input 2 (Secundario): 
        <input type="text" id="input2" placeholder="Ej: 3 (Valor a buscar) o 5,6|7,8 (Matriz B)">
    </div>

    <h3>Resultado</h3>

    <div id="resultContainer">Aquí se mostrará el resultado del ejercicio.</div>

    <script type="module" src="js/main.js"></script>

</body>
</html>
